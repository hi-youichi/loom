[package]
name = "tool-luft"
version.workspace = true
edition.workspace = true
description = "Luft workflow engine integration tool for Loom agents"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
jsonschema = "0.18"
uuid = { version = "1", features = ["v7"] }

tool-core = { path = "../tool-core" }
loom-llm = { path = "../../../foundation/llm" }
agent = { path = "../../agent-core" }

luft = { path = "../../../../luft/crates/luft" }
luft-core = { path = "../../../../luft/crates/luft-core" }

[dev-dependencies]
tempfile = "3"
luft = { path = "../../../../luft/crates/luft", features = ["testing"] }
luft-core = { path = "../../../../luft/crates/luft-core", features = ["testing"] }
