[package]
name = "tool-experimental"
version.workspace = true
edition.workspace = true
description = "Experimental tool implementations for Loom agents"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tool-core = { path = "../tool-core" }
loom-llm = { path = "../../../loom-llm" }
checkpoint = { path = "../../../foundation/checkpoint" }
memory-v2 = { path = "../../../experimental/memory-v2" }
loom-stream = { path = "../../../loom-stream" }
loom-commands = { path = "../../../loom-commands" }
task-core = { path = "../../../experimental/task/task-core" }

tracing = "0.1"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"