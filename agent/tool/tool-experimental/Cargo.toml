[package]
name = "tool-experimental"
version.workspace = true
edition.workspace = true
description = "Experimental tool implementations for anureo agents"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tool-core = { path = "../tool-core" }
tool-basic = { path = "../tool-basic" }
anureo-llm = { path = "../../../foundation/llm" }
model-spec-core = { path = "../../../foundation/model-spec-core" }
checkpoint = { path = "../../../foundation/checkpoint" }
memory-v2 = { path = "../../../experimental/memory-v2" }
task-core = { path = "../../../experimental/task/task-core" }

tracing = "0.1"
thiserror = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
