[package]
name = "tool-extensions"
version.workspace = true
edition.workspace = true
description = "Extension tool implementations for Loom agents"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

loom-llm = { path = "../../../loom-llm" }
loom-types = { path = "../../../loom-types" }
loom-lsp = { path = "../../../loom-lsp" }
loom-stream = { path = "../../../loom-stream" }
config = { path = "../../../config" }

tool-core = { path = "../tool-core" }

lsp-types = "0.95"

tracing = "0.1"
thiserror = { workspace = true }
tokio-stream = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
crossbeam-channel = "0.5"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"