[package]
name = "tool-workflow"
version.workspace = true
edition.workspace = true
description = "Multi-agent workflow engine integration tool for Loom agents"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
jsonschema = "0.18"
uuid = { version = "1", features = ["v7"] }
sha2 = "0.10"
hex = "0.4"

tool-core = { path = "../tool-core" }
loom-llm = { path = "../../../foundation/llm" }
agent = { path = "../../agent-core" }

luft = "0.4"
luft-core = "0.4"
luft-service = "0.4"

[dev-dependencies]
tempfile = "3"
luft = { version = "0.4", features = ["testing"] }
luft-core = { version = "0.4", features = ["testing"] }
skill = { path = "../../skill" }

