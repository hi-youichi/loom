[package]
name = "serve"
version.workspace = true
edition.workspace = true
description = "WebSocket server for Loom CLI remote mode (axum + ws)"
license.workspace = true
authors.workspace = true

[lib]
name = "serve"
path = "src/lib.rs"

[dependencies]
loom-cli-types = { path = "../loom-cli-types" }
loom-protocol = { path = "../loom-protocol" }
loom-graph = { path = "../loom-graph" }
loom-llm = { path = "../loom-llm" }
loom-memory = { path = "../loom-memory" }
loom-prompt = { path = "../loom-prompt" }
loom-workspace = { path = "../loom-workspace" }
loom-tier = { path = "../loom-tier" }
loom-stream = { path = "../loom-stream" }
loom-react-config = { path = "../loom-react-config" }
loom = { path = "../loom" }
agent = { path = "../agent/agent-core" }
config = { path = "../config" }
axum = { version = "0.7", features = ["ws", "json"] }
async-trait = "0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net"] }
notify = { version = "7", features = ["macos_fsevent"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
chrono = "0.4"

[features]
test-server = []

[[bin]]
name = "test-server"
path = "src/bin/test-server.rs"
required-features = ["test-server"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
dotenv = "0.15"
loom = { path = "../loom" }
agent = { path = "../agent/agent-core" }
tempfile = "3"
temp-env = { version = "0.3", features = ["async_closure"] }
