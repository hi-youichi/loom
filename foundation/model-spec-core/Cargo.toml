[package]
name = "model-spec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared model/provider spec types, parsers, and resolvers for Loom"

[lib]
path = "src/lib.rs"

[features]
default = []
resolver = [
    "dep:loom-http-retry",
    "dep:reqwest",
    "dep:tokio",
    "dep:async-trait",
    "dep:tracing",
    "dep:serde_yaml",
]
tier = [
    "resolver",
    "dep:toml",
    "dep:thiserror",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# resolver feature dependencies (all optional)
loom-http-retry = { path = "../loom-http-retry", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
serde_yaml = { version = "0.9", optional = true }

# tier feature dependencies
toml = { version = "0.8", optional = true }
thiserror = { workspace = true, optional = true }