[package]
name = "loom-llm"
version.workspace = true
edition.workspace = true
description = "LLM client abstractions for Loom agents"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
testing = []

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-stream = { workspace = true }
futures-util = "0.3"
futures = "0.3"
once_cell = "1.19"
dashmap = "6.0"
tracing = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# HTTP retry utilities (re-exported via support::http_retry)
loom-http-retry = { path = "../loom-http-retry" }

# OpenAI client (for ChatOpenAI)
async-openai = { version = "0.32", features = ["chat-completion", "model"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

# Config loading (for audit.rs LlmAuditConfig)
env_config = { path = "../config", package = "config" }

# Graph error types (GraphError, Interrupt)
loom-graph-core = { path = "../graph-core" }

# Streaming types (MessageChunk, StreamSink)
stream-event = { path = "../../foundation/stream-event" }

# Model spec (for content_part_modality)
model-spec-core = { path = "../model-spec-core" }

# Optional: LanceDB for model cache
lancedb = { version = "0.23", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }