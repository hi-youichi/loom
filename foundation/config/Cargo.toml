[package]
name = "config"
version.workspace = true
edition.workspace = true
description = "Load .env and TOML config for anureo (single place for all env/config under ~/.anureo)"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Shared tracing file appender + path resolution for CLI / anureo-acp (optional to keep `config` lean).
tracing-init = ["dep:tracing-subscriber", "dep:tracing-appender", "dep:tracing-core", "dep:chrono"]

[dependencies]
anureo-home = { path = "../anureo-home" }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
ureq = { version = "3", default-features = true }
tracing-subscriber = { version = "0.3", optional = true, features = [
    "env-filter",
    "json",
] }
tracing-appender = { version = "0.2", optional = true }
tracing-core = { version = "0.1", optional = true }
model-spec-core = { path = "../model-spec-core" }
dirs = "5.0"
chrono = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
tracing = "0.1"
