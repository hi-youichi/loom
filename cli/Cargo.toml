[package]
name = "cli"
version.workspace = true
edition.workspace = true
description = "CLI for Loom: run ReAct agent from the command line"
license.workspace = true
authors.workspace = true

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom = { path = "../loom" }
agent = { path = "../agent/agent-core" }
agent-extensions = { path = "../agent/agent-extensions" }
loom-llm = { path = "../loom-llm" }
loom-protocol = { path = "../loom-protocol" }
loom-types = { path = "../loom-types" }
tool-core = { path = "../agent/tool/tool-core" }
loom-stream = { path = "../loom-stream" }
loom-stream-display = { path = "../loom-stream-display" }
loom-background-review = { path = "../loom-background-review" }
loom-commands = { path = "../loom-commands" }
loom-cli-types = { path = "../loom-cli-types" }
loom-react-config = { path = "../loom-react-config" }
loom-model-spec = { path = "../loom-model-spec" }
loom-memory = { path = "../loom-memory" }
loom-tier = { path = "../loom-tier" }

serve = { path = "../serve" }
stream-event = { path = "../stream-event" }
config = { path = "../config", features = ["tracing-init"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net"] }
clap = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = "0.1"
chrono = "0.4"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
task-core = { path = "../task-core" }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = { workspace = true }
ctrlc = "3"
termsize = "0.1"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
dotenv = { workspace = true }
tempfile = "3"
