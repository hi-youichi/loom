[package]
name = "loom-memory"
version.workspace = true
edition.workspace = true
description = "Memory implementations for Loom: checkpointing and long-term store"
license.workspace = true
authors.workspace = true

[features]
lance = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema"]

[dependencies]
loom-graph = { path = "../loom-graph" }
loom-llm = { path = "../loom-llm" }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.0"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
async-openai = { version = "0.32", features = ["chat-completion", "embedding", "model"] }
sqlite-vec = "0.1"

# Config for home directory resolution
env_config = { path = "../config", package = "config" }

# Optional: LanceDB for persistent Store with vector search (feature "lance").
lancedb = { version = "0.23", optional = true }
arrow-array = { version = "56.2", optional = true }
arrow-schema = { version = "56.2", optional = true }

[dev-dependencies]
tempfile = "3"
