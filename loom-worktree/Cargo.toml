[package]
name = "loom-worktree"
version.workspace = true
edition.workspace = true
description = "Git worktree isolation for parallel sub-agent execution"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tokio = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
