[package]
name = "loom-tier"
version.workspace = true
edition.workspace = true
description = "Tier resolution, model registry, and LLM factory for Loom"
license.workspace = true
authors.workspace = true

[dependencies]
# Internal crates
loom-graph = { path = "../loom-graph" }
loom-model-spec = { path = "../loom-model-spec" }
loom-protocol = { path = "../loom-protocol" }
model-spec-core = { path = "../model-spec-core" }
loom-react-config = { path = "../loom-react-config" }
env_config = { path = "../config", package = "config" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# TOML (for tier plans)
toml = "0.8"

# Logging
tracing = "0.1"
