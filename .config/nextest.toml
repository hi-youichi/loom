[store]
dir = "target/nextest"

[profile.default]
retries = 0
slow-timeout = { period = "10s", terminate-after = 3, grace-period = "5s" }
failure-output = "immediate-final"
success-output = "never"
status-level = "pass"
# Maximum parallelism: run tests for all crates simultaneously
test-threads = "num-cpus"
# Share compiled artifacts between test runs
panic-abort = false

[profile.default.junit]
path = "target/nextest/junit.xml"

[profile.fast]
retries = 0
slow-timeout = { period = "2s" }
failure-output = "immediate"
success-output = "never"
status-level = "fail"
test-threads = "num-cpus"

[profile.ci]
retries = 2
slow-timeout = { period = "30s", terminate-after = 3, grace-period = "10s" }
failure-output = "immediate-final"
success-output = "never"
status-level = "all"
test-threads = "num-cpus"
