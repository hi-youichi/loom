[package]
name = "loom-curator"
version.workspace = true
edition.workspace = true
description = "Curator system for Loom - background review, skill curation, and memory updates"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
testing = []

[dependencies]
# LLM client (loom-llm crate)
loom-llm = { path = "../../foundation/llm" }


# Config crate for loom_home
env_config = { path = "../../foundation/config", package = "config" }

# SQLite for review history persistence
rusqlite = { version = "0.31", features = ["bundled"] }
checkpoint = { path = "../../foundation/checkpoint" }
checkpoint-sqlite-store = { path = "../../foundation/checkpoint-sqlite-store" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"

dirs = "5"

skill = { path = "../../agent/skill" }
tool-core = { path = "../../agent/tool/tool-core" }
tool-basic = { path = "../../agent/tool/tool-basic" }
tool-experimental = { path = "../../agent/tool/tool-experimental" }
memory-v2 = { path = "../../experimental/memory-v2" }
agent = { path = "../../agent/agent-core" }
loom-graph-core = { path = "../../foundation/graph-core" }
loom-util = { path = "../../foundation/loom-util" }

# Archive handling for curator backup
flate2 = "1.0"
tar = "0.4"
walkdir = "2"

# Regex for YAML parsing (via once_cell for static compile)
once_cell = "1.19"
regex = "1"

[dev-dependencies]
tempfile = "3"
