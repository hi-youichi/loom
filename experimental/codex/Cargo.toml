[package]
name = "loom-codex"
version.workspace = true
edition = "2021"
description = "Loom codex app-server compatible daemon"
license.workspace = true
authors.workspace = true

[[bin]]
name = "loom-codex"
path = "src/main.rs"

[dependencies]
agent = { path = "../../agent/agent-core" }
tool-core = { path = "../../agent/tool/tool-core" }
loom-llm = { path = "../../foundation/llm" }
config = { path = "../../foundation/config" }
stream-event = { path = "../../foundation/stream-event" }

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"