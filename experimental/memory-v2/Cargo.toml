[package]
name = "memory-v2"
version.workspace = true
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "2.0"
fs4 = "0.12"
uuid = { version = "1", features = ["v4"] }
env-config = { path = "../../foundation/config", package = "config" }
regex = "1"

[dev-dependencies]
tempfile = "3"
