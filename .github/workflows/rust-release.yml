name: Rust Release Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.state == 'open'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for generating release notes

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          mkdir -p dist
          tar -czvf "dist/loom-${VERSION}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" loom

      - name: Package Windows binary
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/loom.exe" `
            -DestinationPath "dist/loom-$version-${{ matrix.target }}.zip"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "## Changes since $PREV" > release_notes.md
            echo "" >> release_notes.md
            git log "$PREV..HEAD" --pretty=format:"* %s (%h)" >> release_notes.md
          else
            echo "## Release ${{ github.ref_name }}" > release_notes.md
            echo "" >> release_notes.md
            git log -5 --pretty=format:"* %s (%h)" >> release_notes.md
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
          generate_release_notes: true
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

  installer-smoke-test:
    name: Installer smoke test (${{ matrix.os }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unix installer
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          LOOM_VERSION: ${{ github.ref_name }}
          LOOM_INSTALL_DIR: ${{ runner.temp }}/loom-bin
        run: |
          sh scripts/install.sh --version "$LOOM_VERSION" --install-dir "$LOOM_INSTALL_DIR"
          "$LOOM_INSTALL_DIR/loom" --help

      - name: Verify Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'loom-bin'
          & .\scripts\install.ps1 -Version "${{ github.ref_name }}" -InstallDir $installDir
          & (Join-Path $installDir 'loom.exe') --help
