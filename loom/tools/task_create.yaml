name: task_create
description: |
  Create a new task in the task management system.

  Use this tool when you need to track work items, feature requests, bugs, or any actionable items
  that need to be managed over time. Tasks persist across sessions and are stored in the workspace.

  ## When to Use
  - When you identify work that needs to be done now or later
  - When a user asks you to track something as a task
  - When breaking down a large feature into trackable items
  - When planning work across multiple sessions

  ## Parameters
  - `name` (required): Short, descriptive task title
  - `description`: Detailed description of the task
  - `assignee`: Person responsible for the task
  - `start_time`: When the task should start (ISO 8601 format, or flexible: YYYY-MM-DD, YYYY-MM-DD HH:MM)
  - `status`: Initial status — one of: pending (default), in_progress, completed, cancelled

  ## Output
  Returns the created task object with generated `id`, `created_at`, and all fields.

  ## Examples
  - Create a simple task: `{"name": "Fix login bug"}`
  - Create with details: `{"name": "Add dark mode", "description": "Implement dark theme toggle", "assignee": "Alice", "status": "pending"}`
  - Schedule a task: `{"name": "Release v2.0", "start_time": "2025-09-01", "status": "pending"}`

input_schema:
  type: object
  properties:
    name:
      type: string
      description: "Task name (required)."
    description:
      type: string
      description: "Task description."
    assignee:
      type: string
      description: "Person responsible."
    start_time:
      type: string
      description: "Start time. Formats: ISO 8601, YYYY-MM-DD HH:MM:SS, YYYY-MM-DD. Default: now."
    status:
      type: string
      enum: [pending, in_progress, completed, cancelled]
      description: "Initial status. Default: pending."
  required:
    - name
