name: date
description: |
  Returns the current date and time. By default returns the local datetime in ISO 8601 format.
  Supports optional timezone offset (e.g., "+09:00", "-05:00", "UTC").
  Also supports custom format strings (e.g., "%Y-%m-%d", "%H:%M:%S").
  Useful when the agent needs to know the current date/time for scheduling, timestamps,
  date arithmetic, or any time-sensitive operations.
input_schema:
  type: object
  properties:
    format:
      type: string
      description: |
        Optional strftime format string. Default is ISO 8601 "%Y-%m-%dT%H:%M:%S%:z".
        Examples: "%Y-%m-%d" for date only, "%H:%M:%S" for time only.
    timezone:
      type: string
      description: |
        Optional timezone offset or name. Examples: "UTC", "+09:00", "-05:00".
        Default is the system local timezone.
