name: task_update
description: |
  Update an existing task. Only provided fields are changed.

  Use this tool to modify task properties — change status, reassign, update description, etc.
  Only fields explicitly provided in the arguments will be updated; omitted fields remain unchanged.

  ## When to Use
  - Mark a task as in_progress when starting work
  - Mark a task as completed when finished
  - Reassign a task to someone else
  - Update task description or schedule
  - Cancel a task that's no longer needed

  ## ID Resolution
  Supports ID prefix matching (>= 4 chars), same as `task_show`.

  ## Parameters
  - `id` (required): Task ID or prefix
  - `name`: New name
  - `description`: New description
  - `assignee`: New assignee
  - `start_time`: New start time
  - `status`: New status — pending, in_progress, completed, cancelled

  ## Output
  Returns the updated task object with all fields.

  ## Examples
  - Start work: `{"id": "550e", "status": "in_progress"}`
  - Complete: `{"id": "550e", "status": "completed"}`
  - Reassign: `{"id": "550e", "assignee": "Bob"}`
  - Update details: `{"id": "550e", "name": "Fix login (OAuth)", "description": "Updated: affects OAuth flow"}`

input_schema:
  type: object
  properties:
    id:
      type: string
      description: "Task ID or prefix (required)."
    name:
      type: string
      description: "New task name."
    description:
      type: string
      description: "New description."
    assignee:
      type: string
      description: "New assignee."
    start_time:
      type: string
      description: "New start time (ISO 8601, YYYY-MM-DD HH:MM:SS, or YYYY-MM-DD)."
    status:
      type: string
      enum: [pending, in_progress, completed, cancelled]
      description: "New status."
  required:
    - id
