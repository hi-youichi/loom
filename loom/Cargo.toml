[package]

name = "loom"

version.workspace = true

edition.workspace = true

description = "Loom: minimal agents in Rust with state-in, state-out design"

license.workspace = true

authors.workspace = true



[lib]

path = "src/lib.rs"



[features]

lance = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "loom-memory/lance"]

testing = []



[dependencies]

agent = { path = "../agent/agent-core" }

agent-extensions = { path = "../agent/agent-extensions" }

stream-event = { path = "../stream-event" }

tokio = { workspace = true }

async-trait = { workspace = true }

thiserror = { workspace = true }

serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"

tokio-stream = { workspace = true }

futures-util = "0.3"

futures = "0.3"

once_cell = "1.19"



# LLM client (loom-llm crate)

loom-llm = { path = "../loom-llm" }



# Shared types (loom-types crate)

loom-types = { path = "../loom-types" }



# LSP client (lsp crate)

lsp = { path = "../experimental/tool/lsp" }



# Context compression (loom-compress crate)
loom-compress = { path = "../agent/compress" }



# Commands (loom-commands crate)

loom-commands = { path = "../loom-commands" }



# Memory implementations (loom-memory crate)

loom-memory = { path = "../loom-memory" }



# Graph primitives (loom-graph crate)

loom-graph = { path = "../loom-graph" }



# Pregel runtime (loom-pregel crate)

loom-pregel = { path = "../loom-pregel" }



# Streaming types (loom-stream crate)

loom-stream = { path = "../loom-stream" }



# Stream display (loom-stream-display crate)

loom-stream-display = { path = "../loom-stream-display" }



# Prompt assembly and environment context (loom-prompt crate)

loom-prompt = { path = "../loom-prompt" }



# Tools

tool-core = { path = "../agent/tool/tool-core" }

tool-basic = { path = "../agent/tool/tool-basic" }

tool-extensions = { path = "../agent/tool/tool-extensions" }

tool-experimental = { path = "../agent/tool/tool-experimental" }





# Model spec core types (ModelEntry, ProviderConfig, tier resolution)

model-spec-core = { path = "../foundation/model-spec-core", features = ["tier"] }



# LLM factory: ChatOpenAI, ChatOpenAICompat

async-openai = { version = "0.32", features = ["chat-completion", "embedding", "model"] }

reqwest = { version = "0.12", features = ["json"] }



# React build configuration (loom-react-config crate)

loom-react-config = { path = "../loom-react-config" }



# CLI run types (loom-cli-types crate)

loom-cli-types = { path = "../loom-cli-types" }



# Curator system (loom-curator crate)

loom-curator = { path = "../experimental/curator" }



# Memory system

memory-v2 = { path = "../experimental/memory-v2" }



rusqlite = { version = "0.31", features = ["bundled"] }

task-core = { path = "../experimental/task/task-core" }

tracing = "0.1"



# Optional: LanceDB for persistent Store with vector search (feature "lance").

lancedb = { version = "0.23", optional = true }

arrow-array = { version = "56.2", optional = true }

arrow-schema = { version = "56.2", optional = true }

# futures is now a required dependency (moved above)



# SQLite vector store (SqliteVecStore) for long-term memory with semantic search.

sqlite-vec = "0.1"



# YAML tool definitions (embedded at compile time, parsed at runtime)

serde_yaml = "0.9"



# Glob tool: recursive walk + pattern match under working folder

walkdir = "2"



# Curator backup: tar.gz compression

flate2 = "1.0"

tar = "0.4"

dirs = "5"

glob = "0.3"

which = "6.0"



# Grep tool: ripgrep library stack (grep-regex + grep-searcher + ignore)

grep-regex = "0.1"

grep-searcher = "0.1"

ignore = "0.4"

regex = "1"



# Env + config (load_and_apply, mcp.json discover/parse); local name avoids clash with loom's internal config module

env_config = { path = "../config", package = "config" }



# ISO timestamps (e.g. tool_output_normalizer)

chrono = { version = "0.4", features = ["serde"] }

tokio-util = { version = "0.7.18", features = ["rt"] }

termsize = "0.1"



toml = "0.8"



# LSP support

lsp-types = "0.95"

jsonrpc-core = "18.0"

url = "2.5"





worktree = { path = "../experimental/worktree" }

skill = { path = "../agent/skill" }

[dev-dependencies]

tempfile = "3"

libc = "0.2"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ctor = "0.2"

wiremock = "0.6"

temp-env = { version = "0.3", features = ["async_closure"] }

agent = { path = "../agent/agent-core" }



loom-stream = { path = "../loom-stream" }

loom-llm = { path = "../loom-llm" }

loom-types = { path = "../loom-types" }

loom-react-config = { path = "../loom-react-config" }

async-openai = { version = "0.32", features = ["chat-completion", "embedding", "model"] }

dotenv = { workspace = true }



