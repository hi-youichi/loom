[package]
name = "loom-background-review"
version.workspace = true
edition.workspace = true
description = "Background review system for Loom - analyzes conversations and updates memory/skills"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
testing = []

[dependencies]
# LLM client (loom-llm crate)
loom-llm = { path = "../loom-llm" }

# Shared types (loom-types crate)
loom-types = { path = "../loom-types" }

# Config crate for loom_home
env_config = { path = "../config", package = "config" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"

dirs = "5"

skill = { path = "../agent/skill" }
tool-core = { path = "../agent/tool/tool-core" }
tool-basic = { path = "../agent/tool/tool-basic" }
tool-experimental = { path = "../agent/tool/tool-experimental" }
memory-v2 = { path = "../experimental/memory-v2" }
agent = { path = "../agent/agent-core" }
loom-react-config = { path = "../loom-react-config" }
loom-graph = { path = "../loom-graph" }

# Archive handling for curator backup
flate2 = "1.0"
tar = "0.4"
walkdir = "2"

# Regex for YAML parsing (via once_cell for static compile)
once_cell = "1.19"
regex = "1"

[dev-dependencies]
tempfile = "3"
