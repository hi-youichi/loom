[package]
name = "loom-background-review"
version.workspace = true
edition.workspace = true
description = "Background review system for Loom - analyzes conversations and updates memory/skills"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
testing = []

[dependencies]
# LLM client (loom-llm crate)
loom-llm = { path = "../loom-llm" }

# Shared types (loom-types crate)
loom-types = { path = "../loom-types" }

# Config crate for loom_home
env_config = { path = "../config", package = "config" }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = "0.1"

# File system operations
dirs = "5"

# Archive handling for curator backup
flate2 = "1.0"
tar = "0.4"
walkdir = "2"

# Regex for YAML parsing (via once_cell for static compile)
once_cell = "1.19"
regex = "1"

[dev-dependencies]
tempfile = "3"
