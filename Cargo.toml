[workspace]
resolver = "2"
members = [
    "loom",
    "loom-llm",
    "loom-lsp",
    "loom-memory",
    "loom-cache",
    "loom-worktree",

    "agent/skill",
    "loom-graph",
    "loom-pregel",
    "config",
    "foundation/model-spec-core",
    "loom-examples",
    "apps/cli",
    "stream-event",
    "loom-workspace",
    "apps/acp",
    "loom-workspace/gh",
    "telegram-bot",
    "experimental/task/task-core",
    "experimental/task/task-cli",
    "experimental/task/task-mcp-server",
    "loom-types",
    "agent/agent-core",
    "agent/agent-extensions",
    "loom-compress",
    "loom-commands",
    "loom-stream",
    "agent/tool/tool-core",
    "agent/tool/tool-basic",
    "agent/tool/tool-extensions",
    "agent/tool/tool-experimental",
    "experimental/curator",
    "loom-stream-display",
    "loom-prompt",
    "loom-react-config",
    "loom-cli-types",
    "experimental/memory-v2",
    "foundation/loom-util",
    "foundation/loom-http-retry",
    "loom-codex",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["loom contributors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
dotenv = "0.15"
futures = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
ctor = "0.2"

[profile.test]
opt-level = 2
debug = 1
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
incremental = true

[profile.dev]
opt-level = 0
debug = 2
