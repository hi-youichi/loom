[package]
name = "loom-react-config"
version.workspace = true
edition.workspace = true
description = "ReactBuildConfig and Agent Profile — shared configuration types for Loom agent runners"
license.workspace = true
authors.workspace = true

[dependencies]
# Skill registry (Arc<SkillRegistry> field)
skill = { path = "../agent/skill" }

# Tool traits (Arc<dyn CommandExecutor>, Arc<dyn Tool>)
tool-core = { path = "../agent/tool/tool-core" }
tool-basic = { path = "../agent/tool/tool-basic" }

# Model tier
model-spec-core = { path = "../foundation/model-spec-core" }

# Shared types (BuiltinToolFilter, TotRunnerConfig, GotRunnerConfig)
loom-types = { path = "../loom-types" }

# Prompt assembly (EnvContext for config field)
loom-prompt = { path = "../loom-prompt" }

# Worktree profile config
loom-worktree = { path = "../loom-worktree" }

# Env config (McpServerDef, home::loom_home)
env_config = { path = "../config", package = "config" }

# YAML profile parsing
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
