# AI Company Roster
# 公司团队花名册

## 核心团队（常驻）

- name: CEO
  agent: ceo
  role: 首席执行官
  responsibilities:
    - 理解客户需求
    - 分配任务
    - 管理团队
    - 交付质量把关
  reports_to: 无（顶层）

- name: PM
  agent: pm
  role: 产品经理
  responsibilities:
    - 需求分析
    - 任务拆解
    - 验收标准定义
  reports_to: ceo
  tools_disabled: [write_file, edit_file, multiedit, apply_patch, delete_file, move_file, create_dir]

- name: Architect
  agent: architect
  role: 架构师
  responsibilities:
    - 技术选型
    - 系统设计
    - Code Review
    - 架构决策
  reports_to: ceo
  tools_disabled: []

- name: Engineer
  agent: engineer
  role: 工程师
  responsibilities:
    - 编码实现
    - 修 Bug
    - 技术执行
  reports_to: ceo
  tools_disabled: []

- name: QA
  agent: qa
  role: 测试工程师
  responsibilities:
    - 功能测试
    - 边界测试
    - 验收测试
    - 质量把关
  reports_to: ceo
  tools_disabled: [write_file, edit_file, multiedit, apply_patch, delete_file, move_file, create_dir]

## 扩展团队（按需激活）

- name: Designer
  agent: designer
  role: 设计师
  responsibilities:
    - UI/UX 设计
    - 视觉设计
    - 前端样式
  reports_to: ceo
  tools_disabled: []
  activation: 涉及前端、交互设计时

- name: DevOps
  agent: devops
  role: 运维工程师
  responsibilities:
    - 部署
    - CI/CD
    - 基础设施管理
  reports_to: ceo
  tools_disabled: []
  activation: 涉及部署、环境配置时

- name: DocWriter
  agent: doc-writer-company
  role: 文档工程师
  responsibilities:
    - 技术文档
    - README
    - API 文档
  reports_to: ceo
  tools_disabled: []
  activation: 需要写文档时

## 任务分发规则

simple_tasks:
  description: "单一步骤，明确目标"
  flow: "CEO → 对应角色"
  examples:
    - "修个 typo → engineer"
    - "写个 README → doc-writer-company"

medium_tasks:
  description: "2-3 步骤，需要协调"
  flow: "CEO → 主要角色 → QA 验证"
  examples:
    - "加个新功能 → engineer → qa"
    - "改下 UI → designer → qa"

complex_tasks:
  description: "多步骤，跨领域"
  flow: "CEO → PM 拆解 → Architect 设计 → Engineer 实现 → QA 验收 → CEO 交付"
  examples:
    - "重构认证系统"
    - "新增支付模块"
