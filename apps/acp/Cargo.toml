[package]
name = "acp"
version.workspace = true
edition.workspace = true
description = "ACP (Agent Client Protocol) server for Loom — run Loom as an ACP agent in IDEs"
license.workspace = true
authors.workspace = true

[lib]
name = "loom_acp"
path = "src/lib.rs"

[dependencies]
loom = { path = "../../loom" }
loom-cli-types = { path = "../../loom-cli-types" }

loom-graph = { path = "../../loom-graph" }
loom-llm = { path = "../../loom-llm" }
loom-memory = { path = "../../loom-memory" }
tool-core = { path = "../../agent/tool/tool-core" }
tool-basic = { path = "../../agent/tool/tool-basic" }
loom-types = { path = "../../loom-types" }
loom-react-config = { path = "../../loom-react-config" }
model-spec-core = { path = "../../foundation/model-spec-core", features = ["tier"] }
loom-stream = { path = "../../loom-stream" }

loom-commands = { path = "../../loom-commands" }
loom-curator = { path = "../../experimental/curator" }
config = { path = "../../config", features = ["tracing-init"] }
task-core = { path = "../../experimental/task/task-core" }
loom-prompt = { path = "../../loom-prompt" }
agent-client-protocol = { version = "0.15.1", features = ["unstable_boolean_config", "unstable_session_fork", "unstable_cancel_request", "unstable_model_config_category"] }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
rusqlite = "0.31"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { workspace = true }
uuid = { version = "1.23.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
env_logger = "0.10"
async-trait = { workspace = true }
serial_test = "3"
ctor = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ---- loom-acp e2e test targets (plan 026) ---------------------------------
#
# `tests/e2e_mega.rs` is the single-case mega script. Cargo auto-discovers
# top-level `tests/*.rs`, so we declare it explicitly to keep naming
# deterministic (the file becomes the `e2e_mega` test binary).
#
# `tests/e2e/` is a directory — cargo does NOT auto-discover directories.
# We pin `tests/e2e/main.rs` as the crate root so `mod common;` inside it
# resolves `common/{env,harness,...}.rs` as submodules. Micro tests (M1–M5)
# land under `tests/e2e/*.rs` in Phase 3.

[[test]]
name = "e2e_mega"
path = "tests/e2e_mega.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
