[package]
name = "loom-curator"
version.workspace = true
edition.workspace = true
description = "Curator: background review system for Loom"
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[features]
testing = []

[dependencies]
loom = { path = "../loom" }
loom-agent = { path = "../loom-agent" }
loom-llm = { path = "../loom-llm" }
loom-tools = { path = "../loom-tools" }
loom-types = { path = "../loom-types" }
loom-model-spec = { path = "../loom-model-spec" }
loom-tier = { path = "../loom-tier" }
loom-cli-types = { path = "../loom-cli-types" }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
tar = "0.4"
walkdir = "2"
dirs = "5"
env_config = { path = "../config", package = "config" }
serde_yaml = "0.9"
regex = "1"
once_cell = "1.19"